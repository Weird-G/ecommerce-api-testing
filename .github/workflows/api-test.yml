name: API Auto Test Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - 'qa_auto/**'
      - '.github/workflows/api-test.yml'
      - 'springboot/src/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Job 1: Java 单元测试 + JaCoCo 覆盖率（稳定运行，核心亮点）
  # ------------------------------------------------------------------
  java-unit-test:
    name: JUnit5 + JaCoCo Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Run Unit Tests with JaCoCo
        working-directory: springboot
        run: mvn -B test jacoco:report

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: springboot/target/site/jacoco/

  # ------------------------------------------------------------------
  # Job 2: Python 接口冒烟测试（可选，依赖后端服务）
  # ------------------------------------------------------------------
  pytest-smoke-test:
    name: Pytest Smoke Test (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 200288
          MYSQL_DATABASE: xm_shopping_manager
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p200288 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Database Schema
        run: |
          if [ -f "springboot/init.sql" ]; then
            mysql -h 127.0.0.1 -P 3307 -uroot -p200288 xm_shopping_manager < springboot/init.sql
            echo "[DB] Imported from init.sql"
          else
            echo "[DB] No init.sql found, creating minimal schema..."
            mysql -h 127.0.0.1 -P 3307 -uroot -p200288 xm_shopping_manager -e "
              CREATE TABLE IF NOT EXISTS `admin` (
                `id` INT AUTO_INCREMENT PRIMARY KEY,
                `username` VARCHAR(50) NOT NULL,
                `password` VARCHAR(100) NOT NULL,
                `role` VARCHAR(20) DEFAULT 'ADMIN'
              );
              INSERT IGNORE INTO `admin` (`username`, `password`, `role`) VALUES ('admin', '123456', 'ADMIN');
            "
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Build & Start Spring Boot
        working-directory: springboot
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/*.jar \
            --spring.datasource.url="jdbc:mysql://127.0.0.1:3307/xm_shopping_manager?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true" \
            --spring.datasource.username=root \
            --spring.datasource.password=200288 \
            > /tmp/springboot.log 2>&1 &
          echo "SpringBoot PID=$!"

      - name: Wait for Backend Ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/ > /dev/null 2>&1; then
              echo "[OK] Backend ready (${i}x2s)"
              exit 0
            fi
            sleep 2
          done
          echo "[WARN] Backend startup timeout, skipping API tests"
          cat /tmp/springboot.log || true
          exit 0

      - name: Set up Python & Run Smoke Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies & Run
        working-directory: qa_auto
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          mkdir -p reports
          pytest tests/test_00_smoke.py -v --alluredir=reports/allure-results || true

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-smoke-results
          path: |
            qa_auto/reports/allure-results/
            /tmp/springboot.log
