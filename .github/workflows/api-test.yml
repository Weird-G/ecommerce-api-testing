name: API Auto Test Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - 'qa_auto/**'
      - '.github/workflows/api-test.yml'
      - 'springboot/src/**'
      - 'springboot/init.sql'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Which tests to run'
        required: false
        default: 'full'
        type: choice
        options:
          - smoke
          - goods
          - order
          - full

# 部署 Allure 报告到 GitHub Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一分支同时只能跑一个，避免并发覆盖 Pages
concurrency:
  group: api-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Job 1: Java 单元测试 + JaCoCo 覆盖率（白盒测试）
  # ------------------------------------------------------------------
  java-unit-test:
    name: JUnit5 + JaCoCo Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Run Unit Tests with JaCoCo
        working-directory: springboot
        run: mvn -B test jacoco:report

      - name: Upload JaCoCo Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: springboot/target/site/jacoco/

  # ------------------------------------------------------------------
  # Job 2: Python 接口测试（依赖 Java 测试通过）
  # 起 MySQL → 导 schema → 编译启动 SpringBoot → 跑 pytest → 上传结果
  # ------------------------------------------------------------------
  api-test:
    name: Pytest API Test (Full)
    runs-on: ubuntu-latest
    needs: java-unit-test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xm_shopping_manager
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Environment
        run: |
          set -x
          echo "=== Runner info ==="
          cat /etc/os-release | head -3
          echo "=== File check ==="
          ls -la springboot/init.sql
          file springboot/init.sql
          echo "=== First 3 lines of init.sql ==="
          head -3 springboot/init.sql
          echo "=== Network connectivity to MySQL ==="
          nc -zv 127.0.0.1 3307 2>&1 || echo "nc not available, try timeout"
          timeout 5 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3307' 2>&1 && echo "TCP 3307 reachable" || echo "TCP 3307 NOT reachable"

      - name: Install MySQL Client
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y mysql-client
          which mysql
          mysql --version

      - name: Wait for MySQL Ready
        run: |
          set -ex
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3307 -uroot -proot --silent 2>&1; then
              echo "[OK] MySQL ready (${i}x2s)"
              exit 0
            fi
            echo "ping attempt $i failed, sleep 2s"
            sleep 2
          done
          echo "[FAIL] MySQL startup timeout"
          # 输出容器日志
          docker logs $(docker ps -q --filter ancestor=mysql:8.0) 2>&1 | tail -30
          exit 1

      - name: Import Database Schema
        run: |
          set -ex
          ls -la springboot/init.sql
          # 加 --verbose 看导入进度，stderr 也输出
          mysql --verbose -h 127.0.0.1 -P 3307 -uroot -proot xm_shopping_manager < springboot/init.sql 2>&1 | tail -30
          echo "[DB] Imported from init.sql"
          mysql -h 127.0.0.1 -P 3307 -uroot -proot -e "USE xm_shopping_manager; SHOW TABLES;"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Build & Start Spring Boot
        working-directory: springboot
        run: |
          set -x
          mvn -B -q package -DskipTests
          nohup java -jar target/*.jar \
            --spring.datasource.url="jdbc:mysql://127.0.0.1:3307/xm_shopping_manager?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true" \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            > /tmp/springboot.log 2>&1 &
          echo "SpringBoot PID=$!"

      - name: Wait for Backend Ready
        run: |
          set -x
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://localhost:9090/ 2>&1; then
              echo "[OK] Backend ready (${i}x2s)"
              # 多等 5 秒让后端完成初始化（数据库连接池、定时任务等）
              sleep 5
              # 再确认一次，防止刚起来就崩
              if curl -sf -o /dev/null http://localhost:9090/ 2>&1; then
                echo "[OK] Backend still alive after 5s sleep"
                # 输出后端进程状态
                ps -ef | grep -E 'java -jar' | grep -v grep
                exit 0
              else
                echo "[FAIL] Backend crashed after initial readiness"
                cat /tmp/springboot.log | tail -50
                exit 1
              fi
            fi
            sleep 2
          done
          echo "[FAIL] Backend startup timeout (120s)"
          cat /tmp/springboot.log | tail -80
          exit 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: qa_auto/requirements.txt

      - name: Patch Config for CI Environment
        working-directory: qa_auto
        run: |
          set -x
          # CI 上 MySQL service 容器映射到 host:3307，本地默认 3306 需要覆盖
          sed -i 's/port: 3306/port: 3307/' config/config.yaml
          # 让 mysql.host 跟 service 容器对齐
          sed -i 's/host: "localhost"/host: "127.0.0.1"/' config/config.yaml
          echo "=== Patched config.yaml ==="
          cat config/config.yaml

      - name: Install Dependencies & Run Tests
        working-directory: qa_auto
        run: |
          set -x
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p reports

          case "${{ github.event.inputs.test_target || 'full' }}" in
            smoke)  TEST_FILES="tests/test_00_smoke.py" ;;
            goods)  TEST_FILES="tests/test_02_goods_crud.py" ;;
            order)  TEST_FILES="tests/test_03_order_flow.py" ;;
            full)   TEST_FILES="tests/" ;;
            *)      TEST_FILES="tests/" ;;
          esac

          echo "Running: $TEST_FILES"
          # --tb=long 输出完整堆栈；--maxfail=10 防止雪崩；-rA 显示所有用例结果
          pytest $TEST_FILES -v \
            --tb=long \
            --maxfail=10 \
            -rA \
            --alluredir=reports/allure-results \
            --reruns 1

      - name: Upload Allure Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: qa_auto/reports/allure-results/
          retention-days: 14

      - name: Upload SpringBoot Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: springboot-log
          path: /tmp/springboot.log

  # ------------------------------------------------------------------
  # Job 3: 生成 Allure HTML 报告并部署到 GitHub Pages
  # ------------------------------------------------------------------
  allure-report:
    name: Generate & Deploy Allure Report
    runs-on: ubuntu-latest
    needs: api-test
    if: always()

    steps:
      - name: Checkout Code (with history for trend)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Allure Raw Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Generate Allure HTML Report
        uses: simple-elf/allure-report-action@v1.6
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          subfolder: allure

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          destination_dir: allure
