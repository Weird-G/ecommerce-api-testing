name: API Auto Test Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - 'qa_auto/**'
      - '.github/workflows/api-test.yml'
      - 'springboot/src/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Job 1: Java 单元测试 + JaCoCo 覆盖率（稳定运行，核心亮点）
  # ------------------------------------------------------------------
  java-unit-test:
    name: JUnit5 + JaCoCo Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Run Unit Tests with JaCoCo
        working-directory: springboot
        run: mvn -B test jacoco:report

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: springboot/target/site/jacoco/
