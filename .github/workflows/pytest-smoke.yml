name: Pytest API Smoke Test

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: 'Which tests to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - goods
          - order
          - full

jobs:
  pytest-smoke-test:
    name: Pytest API Smoke Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 200288
          MYSQL_DATABASE: xm_shopping_manager
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p200288 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Database Schema
        run: |
          if [ -f "springboot/init.sql" ]; then
            mysql -h 127.0.0.1 -P 3307 -uroot -p200288 xm_shopping_manager < springboot/init.sql
            echo "[DB] Imported from init.sql"
          else
            echo "[DB] No init.sql found"
            exit 1
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      - name: Build & Start Spring Boot
        working-directory: springboot
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/*.jar \
            --spring.datasource.url="jdbc:mysql://127.0.0.1:3307/xm_shopping_manager?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true" \
            --spring.datasource.username=root \
            --spring.datasource.password=200288 \
            > /tmp/springboot.log 2>&1 &
          echo "SpringBoot PID=$!"

      - name: Wait for Backend Ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/ > /dev/null 2>&1; then
              echo "[OK] Backend ready (${i}x2s)"
              exit 0
            fi
            sleep 2
          done
          echo "[FAIL] Backend startup timeout"
          cat /tmp/springboot.log
          exit 1

      - name: Set up Python & Run Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies & Run
        working-directory: qa_auto
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          mkdir -p reports

          case "${{ github.event.inputs.test_target }}" in
            smoke)
              TEST_FILES="tests/test_00_smoke.py"
              ;;
            goods)
              TEST_FILES="tests/test_02_goods_crud.py"
              ;;
            order)
              TEST_FILES="tests/test_03_order_flow.py"
              ;;
            full)
              TEST_FILES="tests/"
              ;;
            *)
              TEST_FILES="tests/test_00_smoke.py"
              ;;
          esac

          echo "Running: $TEST_FILES"
          pytest $TEST_FILES -v --alluredir=reports/allure-results

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-smoke-results
          path: |
            qa_auto/reports/allure-results/
            /tmp/springboot.log
